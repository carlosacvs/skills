<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" rx="16" fill="#f7f7f5"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a85"/></marker>
  </defs>
  <g font-size="14" fill="#1f1f1d">
    <rect x="30" y="40" width="190" height="80" rx="10" fill="#fff" stroke="#d6d6d1"/>
    <text x="125" y="72" text-anchor="middle" font-weight="600">Pedido</text>
    <text x="125" y="95" text-anchor="middle" font-size="12" fill="#5c5c58">"monta o post da semana"</text>

    <rect x="260" y="40" width="190" height="80" rx="10" fill="#fff" stroke="#d6d6d1"/>
    <text x="355" y="72" text-anchor="middle" font-weight="600">Acha a ficha</text>
    <text x="355" y="95" text-anchor="middle" font-size="12" fill="#5c5c58">estudio.md do dono</text>

    <rect x="490" y="20" width="380" height="120" rx="10" fill="#fff8e8" stroke="#e8d3a0"/>
    <text x="680" y="48" text-anchor="middle" font-weight="600">Primeira vez</text>
    <text x="680" y="74" text-anchor="middle" font-size="12" fill="#5c5c58">sem identidade: entrevista, site, Instagram, prints</text>
    <text x="680" y="94" text-anchor="middle" font-size="12" fill="#5c5c58">→ design system → projeto no ChatGPT</text>
    <text x="680" y="114" text-anchor="middle" font-size="12" fill="#5c5c58">e notebook no Gemini → ficha</text>

    <line x1="220" y1="80" x2="258" y2="80" stroke="#8a8a85" stroke-width="2" marker-end="url(#a)"/>
    <line x1="450" y1="80" x2="488" y2="80" stroke="#8a8a85" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <line x1="355" y1="120" x2="355" y2="178" stroke="#8a8a85" stroke-width="2" marker-end="url(#a)"/>

    <rect x="80" y="180" width="330" height="200" rx="10" fill="#fff" stroke="#d6d6d1"/>
    <text x="245" y="210" text-anchor="middle" font-weight="600">Imagem pronta</text>
    <text x="245" y="240" text-anchor="middle" font-size="12" fill="#5c5c58">foto ou cena, sem texto</text>
    <text x="245" y="270" text-anchor="middle" font-size="12" fill="#5c5c58">gera no projeto, com 2 ou 3 fotos</text>
    <text x="245" y="290" text-anchor="middle" font-size="12" fill="#5c5c58">de referência em toda mensagem</text>
    <text x="245" y="320" text-anchor="middle" font-size="12" fill="#5c5c58">confere rosto, mãos, proibições</text>
    <text x="245" y="350" text-anchor="middle" font-size="12" fill="#5c5c58">→ salva na pasta de saída</text>

    <rect x="450" y="180" width="400" height="200" rx="10" fill="#fff" stroke="#d6d6d1"/>
    <text x="650" y="210" text-anchor="middle" font-weight="600">Fundo + montagem</text>
    <text x="650" y="240" text-anchor="middle" font-size="12" fill="#5c5c58">post, carrossel, story, capa</text>
    <text x="650" y="270" text-anchor="middle" font-size="12" fill="#5c5c58">a IA gera só o fundo, sem texto e sem logo</text>
    <text x="650" y="290" text-anchor="middle" font-size="12" fill="#5c5c58">texto e logo entram no canvas do Claude Design,</text>
    <text x="650" y="310" text-anchor="middle" font-size="12" fill="#5c5c58">pelas cores e fontes do design system</text>
    <text x="650" y="340" text-anchor="middle" font-size="12" fill="#5c5c58">trocar uma palavra = editar, não gerar de novo</text>
    <text x="650" y="360" text-anchor="middle" font-size="12" fill="#5c5c58">→ exporta os PNGs no tamanho final</text>
  </g>
</svg>
